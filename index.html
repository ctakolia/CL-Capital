<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PL Capital Stock Dashboard</title>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --primary: #2563eb;
      --success-bg: #dcfce7;
      --success-text: #15803d;
      --warning-bg: #fef9c3;
      --warning-text: #a16207;
      --accent-bg: #dbeafe;
      --accent-text: #1e40af;
      --highlight-bg: #e0f2fe; /* Distinct color for selected row */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 9999px;
      background-color: var(--warning-bg);
      color: var(--warning-text);
      font-weight: 600;
    }

    .action-card {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 0.85rem;
    }

    .btn {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .kpi-card .title {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .kpi-card .value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .controls-card {
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box, .filter-select {
      padding: 6px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      background-color: var(--bg-color);
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 0 0 8px 8px;
      border: 1px solid var(--border-color);
      overflow-x: auto;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      max-height: 70vh;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
      min-width: 1100px;
    }

    th {
      background-color: #f1f5f9;
      padding: 8px 10px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th:hover {
      background-color: #e2e8f0;
    }

    td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    tr {
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    tr.selected-row {
      background-color: var(--highlight-bg) !important;
      font-weight: 500;
    }

    .rating-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.75rem;
    }

    .rating-buy { background: var(--success-bg); color: var(--success-text); }
    .rating-accumulate { background: var(--accent-bg); color: var(--accent-text); }
    .rating-hold { background: var(--warning-bg); color: var(--warning-text); }

    .text-green { color: var(--success-text); font-weight: 600; }
    .text-muted { color: var(--text-muted); }
    .font-semibold { font-weight: 600; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>PL Capital Stock Dashboard</h1>
        <p class="text-muted" style="font-size: 0.78rem; margin-top: 2px;">Compact Portfolio View</p>
      </div>
      <div id="statusBadge" class="status-badge">Waiting for CSV Upload</div>
    </header>

    <!-- Action Card -->
    <div class="action-card">
      <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSaDtHS-8-lVtWY2J7qO5b2-YurI6x4jGjyyeLx4IC4inj_JehMFHY5SETO7b2-ehbsbt3OTmEaR-Cy/pub?gid=1098099968&single=true&output=csv" class="btn" target="_blank">📥 Download Latest CSV from Sheet</a>
      
      <div style="border-left: 1px solid var(--border-color); height: 24px; margin: 0 4px;"></div>

      <label for="csvFileInput" style="font-weight:600; cursor:pointer;">📁 Upload Updated CSV:</label>
      <input type="file" id="csvFileInput" accept=".csv" style="font-size: 0.8rem;" />
    </div>

    <!-- KPI Summary Cards -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="title">Total Stocks</div>
        <div class="value" id="kpiTotalStocks">0</div>
      </div>
      <div class="kpi-card">
        <div class="title">Total Invested</div>
        <div class="value" id="kpiTotalInvestment">₹ 0</div>
      </div>
      <div class="kpi-card">
        <div class="title">Avg Target Upside</div>
        <div class="value" id="kpiAvgTarget">0%</div>
      </div>
      <div class="kpi-card">
        <div class="title">BUY / Accumulate</div>
        <div class="value" id="kpiBuyCount">0</div>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="controls-card">
      <input type="text" id="searchInput" class="search-box" placeholder="Search by Stock Name or Symbol..." />
      <select id="ratingFilter" class="filter-select">
        <option value="ALL">All Ratings</option>
        <option value="BUY">BUY</option>
        <option value="ACCUMULATE">Accumulate</option>
        <option value="HOLD">HOLD</option>
      </select>
    </div>

    <!-- Stock Data Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable(0)">Sr.</th>
            <th onclick="sortTable(1)">Symbol</th>
            <th onclick="sortTable(2)">Company Name</th>
            <th onclick="sortTable(3)">LTP (₹)</th>
            <th onclick="sortTable(4)">52W Low (₹)</th>
            <th onclick="sortTable(5)">Diff 52W (%)</th>
            <th onclick="sortTable(6)">Target Price (₹)</th>
            <th onclick="sortTable(7)">Target %</th>
            <th onclick="sortTable(8)">My Inv (₹)</th>
            <th onclick="sortTable(9)">Rating</th>
            <th onclick="sortTable(10)">Date</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let currentStocks = [];

    function parseCSVLine(text) {
      let result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cur.trim().replace(/^"|"$/g, ''));
          cur = '';
        } else {
          cur += c;
        }
      }
      result.push(cur.trim().replace(/^"|"$/g, ''));
      return result;
    }

    function cleanNumber(str) {
      if (!str) return 0;
      let cleaned = str.replace(/[^0-9.-]+/g, '');
      return parseFloat(cleaned) || 0;
    }

    function parseCSVData(rawCsv) {
      const lines = rawCsv.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length <= 1) return [];

      const parsed = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (cols.length < 5) continue;

        parsed.push({
          sr: cols[0] || i,
          symbol: cols[1] || 'N/A',
          name: cols[2] || 'N/A',
          ltp: cleanNumber(cols[6]),
          awayFromLow: cols[7] || '0',  // Mapped to 'Away From 52 WLow' column
          myInvest: cleanNumber(cols[10]),
          low52: cleanNumber(cols[12]),
          targetPrice: cleanNumber(cols[14]),
          targetPctRaw: cols[15] || '0',
          targetPct: cleanNumber(cols[15]),
          rating: cols[16] || 'N/A',
          date: cols[17] || 'N/A'
        });
      }
      return parsed;
    }

    document.getElementById('csvFileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        currentStocks = parseCSVData(evt.target.result);
        const badge = document.getElementById('statusBadge');
        badge.innerText = 'Loaded ' + file.name;
        badge.style.backgroundColor = '#dcfce7';
        badge.style.color = '#15803d';
        calculateKPIs(currentStocks);
        renderTable(currentStocks);
      };
      reader.readAsText(file);
    });

    function calculateKPIs(stocks) {
      document.getElementById('kpiTotalStocks').innerText = stocks.length;
      const totalInv = stocks.reduce((acc, curr) => acc + curr.myInvest, 0);
      document.getElementById('kpiTotalInvestment').innerText = '₹ ' + totalInv.toLocaleString('en-IN');
      const avgTarget = stocks.length > 0 ? (stocks.reduce((acc, curr) => acc + curr.targetPct, 0) / stocks.length).toFixed(2) : 0;
      document.getElementById('kpiAvgTarget').innerText = avgTarget + '%';
      const buyCount = stocks.filter(s => ['BUY', 'ACCUMULATE'].includes(s.rating.toUpperCase())).length;
      document.getElementById('kpiBuyCount').innerText = buyCount;
    }

    function renderTable(stocks) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      stocks.forEach(stock => {
        const tr = document.createElement('tr');
        let ratingClass = 'rating-hold';
        const rUpper = stock.rating.toUpperCase();
        if (rUpper === 'BUY') ratingClass = 'rating-buy';
        if (rUpper === 'ACCUMULATE') ratingClass = 'rating-accumulate';

        tr.innerHTML = `
          <td>${stock.sr}</td>
          <td class="font-semibold">${stock.symbol}</td>
          <td>${stock.name}</td>
          <td>₹ ${stock.ltp.toLocaleString('en-IN')}</td>
          <td>₹ ${stock.low52.toLocaleString('en-IN')}</td>
          <td>${stock.awayFromLow}</td>
          <td>₹ ${stock.targetPrice.toLocaleString('en-IN')}</td>
          <td class="text-green">${stock.targetPctRaw}</td>
          <td>₹ ${stock.myInvest.toLocaleString('en-IN')}</td>
          <td><span class="rating-badge ${ratingClass}">${stock.rating}</span></td>
          <td class="text-muted">${stock.date}</td>
        `;

        // Click event to toggle row identification highlight
        tr.addEventListener('click', function() {
          const previouslySelected = tbody.querySelector('tr.selected-row');
          if (previouslySelected && previouslySelected !== tr) {
            previouslySelected.classList.remove('selected-row');
          }
          tr.classList.toggle('selected-row');
        });

        tbody.appendChild(tr);
      });
    }

    function applyFilters() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const rating = document.getElementById('ratingFilter').value.toUpperCase();

      const filtered = currentStocks.filter(s => {
        const matchesSearch = s.name.toLowerCase().includes(search) || s.symbol.toLowerCase().includes(search);
        const matchesRating = rating === 'ALL' || s.rating.toUpperCase() === rating;
        return matchesSearch && matchesRating;
      });

      renderTable(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('ratingFilter').addEventListener('change', applyFilters);

    let sortAsc = false;
    function sortTable(colIdx) {
      const keys = ['sr', 'symbol', 'name', 'ltp', 'low52', 'awayFromLow', 'targetPrice', 'targetPct', 'myInvest', 'rating', 'date'];
      const key = keys[colIdx];
      sortAsc = !sortAsc;

      currentStocks.sort((a, b) => {
        if (a[key] < b[key]) return sortAsc ? -1 : 1;
        if (a[key] > b[key]) return sortAsc ? 1 : -1;
        return 0;
      });

      renderTable(currentStocks);
    }
  </script>
</body>
</html>
